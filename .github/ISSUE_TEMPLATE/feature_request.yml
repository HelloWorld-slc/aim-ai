name: 功能建议
description: 描述你希望改善的教学或编程场景
title: "[Feature] "
body:
  - type: textarea
    id: problem
    attributes:
      label: 当前遇到什么问题？
      description: 说明谁在什么场景下遇到了什么困难。
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: 期望的使用方式
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: 已尝试的方法与相关资料（可选）
